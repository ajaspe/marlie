<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Marlie | Corpus Builder</title>
	<link rel="stylesheet" href="corpus_builder.css">
</head>

<body>
	<div class="container">
		<h1>Marlie Corpus Builder</h1>
		<p class="subtitle">Upload PDFs to Gemini and generate a corpus JSON file.</p>

		<div class="card">
			<div class="form-group">
				<label for="apiKey">Gemini API Key</label>
				<input type="password" id="apiKey" placeholder="Enter your API Key">
				<small>Requires a Gemini API Key. Keys are saved locally in your browser.</small>
			</div>

			<div class="form-group">
				<label for="corpusName">Corpus Name</label>
				<input type="text" id="corpusName" placeholder="e.g., marlie_docs">
			</div>

			<div class="form-group">
				<label for="pdfFiles">PDF Files</label>
				<div class="file-drop-area" id="dropArea">
					<span class="file-msg">Choose PDF files or drag & drop them here</span>
					<input class="file-input" type="file" id="pdfFiles" multiple accept="application/pdf">
				</div>
				<ul id="fileList" class="file-list"></ul>
			</div>

			<button id="uploadBtn" class="primary-btn" disabled>Upload and Generate Corpus</button>
		</div>

		<div class="card log-card">
			<h3>Progress Log</h3>
			<div id="logArea" class="log-area"></div>
		</div>
	</div>

	<!-- The logic script will handle everything else -->
	<script src="corpus_builder.js"></script>
</body>

</html>
